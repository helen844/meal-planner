<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#24493b">
<title>Meal Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: phone app. Fixed bottom tab bar; week view = day strip + big meal cards; sheets slide up for choosing and editing */
  --bg:#eef1ec; --surface:#ffffff; --sunk:#f5f7f3; --ink:#18231d; --muted:#5f6d66; --line:#dde3dd;
  --brand:#24493b; --brand-ink:#f3f6f1; --accent:#2f6b55; --accent-soft:#dcebe3;
  --b:#b5751d; --b-soft:#f7ebd6; --l:#22708f; --l-soft:#dbeef5; --d:#7b4a7c; --d-soft:#f1e3f0; --s:#5e7d2c; --s-soft:#e7f0d8;
  --warn:#b35a12;
  --display:"Fraunces",Georgia,serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101613; --surface:#18201c; --sunk:#141b17; --ink:#e6ede8; --muted:#97a69e; --line:#28332d;
    --brand:#16302a; --brand-ink:#e6efe9; --accent:#7cc3a4; --accent-soft:#1d332a;
    --b:#e3a957; --b-soft:#33281a; --l:#6dbad8; --l-soft:#16303b; --d:#cf9bd0; --d-soft:#30223a; --s:#a6c96e; --s-soft:#25301a;
    --warn:#f0a35a; color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:650;line-height:1.12;text-wrap:balance}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.2rem}
h3{font-size:1.02rem;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}

/* app chrome */
.top{background:var(--brand);color:var(--brand-ink);padding:calc(14px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 26px 26px}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top.withdays{padding-bottom:52px}
.top .eyebrow{font-size:.8rem;opacity:.75;letter-spacing:.02em}
.top h1{color:var(--brand-ink)}
.topbtns{display:flex;gap:8px}
.tbtn{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--brand-ink);display:grid;place-items:center;padding:0;position:relative}
.tbtn svg{width:20px;height:20px}
.syncdot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:9px;border:2px solid var(--brand)}
.sync-ok .syncdot{background:#6fd39f}.sync-pending .syncdot{background:#f2c14e}.sync-error .syncdot{background:#ff7a59}.sync-off .syncdot{background:#9aa5a0}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5}
.icon{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:1.15rem;padding:0;flex:none}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.note{font-size:.85rem;background:var(--surface);border:1px dashed var(--warn);color:var(--warn);border-radius:12px;padding:10px 12px}
.sectionhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}

/* meal colours */
.m-breakfast{--m:var(--b);--ms:var(--b-soft)}
.m-lunch{--m:var(--l);--ms:var(--l-soft)}
.m-dinner{--m:var(--d);--ms:var(--d-soft)}
.m-snack{--m:var(--s);--ms:var(--s-soft)}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:-34px;position:relative}
.dbtn{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 2px 8px rgba(20,40,30,.06)}
.dbtn .dn{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dbtn .dd{font-family:var(--display);font-size:1.15rem;font-weight:600}
.dbtn .dot{width:5px;height:5px;border-radius:5px;background:transparent}
.dbtn.today .dot{background:var(--accent)}
.dbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.dbtn[aria-pressed="true"] .dn,.dbtn[aria-pressed="true"] .dd{color:var(--bg)}
.dbtn[aria-pressed="true"].today .dot{background:var(--bg)}

/* meal cards */
.meal{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:86px}
.meal .band{width:8px;background:var(--m);flex:none}
.meal .main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.meal .lab{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--m)}
.meal .nm{font-family:var(--display);font-size:1.12rem;font-weight:600;line-height:1.2}
.meal .nm.empty{font-family:var(--body);font-weight:500;font-size:1rem;color:var(--muted)}
.meal .meta{font-size:.82rem;color:var(--muted)}
.meal .chg{border:0;border-left:1px solid var(--line);background:var(--ms);color:var(--m);font-weight:700;font-size:.8rem;padding:0 14px;min-width:76px}
.daytotal{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}

/* batch / glance */
.cook{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.cook:first-of-type{border-top:0}
.cook .t{flex:1;min-width:0}
.cook .t button{all:unset;cursor:pointer;font-weight:600;display:block}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:38px;height:38px;font-size:1.15rem}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.glance{display:grid;grid-template-columns:44px 1fr;gap:0;font-size:.92rem}
.glance > *{padding:8px 0;border-top:1px solid var(--line)}
.glance > :nth-child(-n+2){border-top:0}
.glance .gd{font-weight:700;color:var(--muted)}
.glance .gd.today{color:var(--accent)}
.glance button{all:unset;cursor:pointer;display:block}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{background:var(--sunk);border-radius:12px;padding:9px 4px;text-align:center}
.tile b{display:block;font-family:var(--display);font-size:1.08rem;font-weight:600}
.tile span{font-size:.7rem;color:var(--muted)}

/* recipes */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;min-height:46px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:600;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.rgrid{grid-template-columns:1fr 1fr}}
.rcard{display:flex;align-items:stretch;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;overflow:hidden}
.rcard .band{width:6px;background:var(--m);flex:none}
.rcard .t{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rcard strong{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2}
.rcard .marks{padding:12px 14px 0 0;color:var(--accent);font-size:.95rem;white-space:nowrap}

/* recipe detail */
.hero{background:var(--ms);border-radius:0 0 26px 26px;padding:calc(12px + env(safe-area-inset-top)) 18px 22px}
.hero .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:1.9rem}
.hero .cat{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--m)}
.backbar{display:flex;justify-content:space-between;align-items:center}
.ing{list-style:none;padding:0}
.ing li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.ing li:first-child{border-top:0}
.ing .q{min-width:78px;font-weight:700;font-variant-numeric:tabular-nums}
.steps{list-style:none;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.steps li.done{color:var(--muted);text-decoration:line-through}
.steps li.done::before{content:"✓"}
.toggle[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}

/* shop */
.aisle h3{font-family:var(--body);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.item label{flex:1;display:flex;gap:8px;align-items:baseline;cursor:pointer}
.item .q{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done label{color:var(--muted);text-decoration:line-through}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:9px 12px;min-height:42px}
.progress{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:8px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav div{display:flex;max-width:640px;margin:0 auto}
.nav button{flex:1;border:0;background:transparent;padding:10px 4px 12px;font-size:.75rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet.full{max-height:100%;height:100%;border-radius:0;padding-top:calc(18px + env(safe-area-inset-top))}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);align-self:center;margin-top:-6px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 2px;min-height:52px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:9px 0;font-weight:600;font-size:.85rem}
.daypick button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.divider{height:1px;background:var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.9rem;z-index:20;max-width:90%;text-align:center}
.copybox{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:10px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
}
@media (max-width:370px){.tiles{grid-template-columns:repeat(3,1fr)}.dbtn .dd{font-size:1rem}}
</style>
</head>

const FR={0.25:"¼",0.33:"⅓",0.5:"½",0.67:"⅔",0.75:"¾"};
function fmtAmt(a){
  if(!a) return "";

  let whole=Math.floor(a),f=a-whole;
  let best=[0,.25,.33,.5,.67,.75,1].reduce((p,c)=>Math.abs(c-f)<Math.abs(p-f)?c:p,0);

const UFR={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3};
function parseAmount(s){
  s=s.trim().replace(",",".");let m;
  if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1]+ +m[2]/+m[3];
  if((m=s.match(/^(\d+)\/(\d+)$/))) return +m[1]/+m[2];
  if((m=s.match(/^(\d+(?:\.\d+)?)?\s*([½¼¾⅓⅔])$/))) return (m[1]?+m[1]:0)+UFR[m[2]];
  return parseFloat(s)||0;
}
function parseLine(line){

  if(!s) return null;
  const m=s.match(/^((?:\d+\s+)?\d+\/\d+|\d+(?:[.,]\d+)?\s*[½¼¾⅓⅔]?|[½¼¾⅓⅔])\s*(.*)$/);
  if(!m) return [0,"",s];
  const amt=parseAmount(m[1]);const rest=m[2];
  const um=rest.match(/^(g|kg|ml|l|tsp|tbsp|pinch(?:es)?|sachets?|tins?|cloves?|jars?|cups?)\.?\s+(.+)$/i);

const AISLES=["Fruit & veg","Fish","Fridge","Frozen","Cupboard","Other","Storecupboard"];
function aisleOf(item,unit){
  const s=item.toLowerCase();
  if(/^(cold |warm )?water\b/.test(s)) return null;
  if(/frozen/.test(s)) return "Frozen";
  if(/protein powder/.test(s)) return "Cupboard";
  if(["tin","jar"].includes(unit)||/coconut milk|peanut butter|soy sauce|tinned|passata/.test(s)) return "Cupboard";
  if(/salmon|tuna|\bcod\b|hake|merluza|prawn|sardine|bonito|mackerel|clam|white fish/.test(s)) return "Fish";
  if(/\beggs?\b|milk|butter|yoghurt|yogurt|cheese|tofu/.test(s)) return "Fridge";
  if(/^salt|\bsalt\b|black pepper|cinnamon|baking powder|\boil\b|cumin|piment|paprika|turmeric|curry|chilli flakes|bay leaf|oregano|nutritional yeast|vanilla|dried dill|stock cube|sesame seeds/.test(s)) return "Storecupboard";
  if(/banana|apple|lemon|lime|onion|garlic|potato|spinach|pepper|carrot|tomato|cucumber|avocado|cabbage|parsley|coriander|dill|ginger|berr|courgette|leek|squash|rosemary|herb|lettuce|mushroom|aubergine/.test(s)) return "Fruit & veg";
  if(/oat|flour|pasta|penne|lasagne|rice|quinoa|honey|sugar|chocolate|raisin|nut|almond|tahini|stock|bread|tortilla|panko|breadcrumb|olive|caper|chia|mustard|vinegar|wine|yeast|cocoa|sweetcorn|sourdough|seeds|paste/.test(s)) return "Cupboard";
  return "Other";
}
function normKey(item){
  let s=item.toLowerCase().split(/[,(]/)[0].trim(),prev;
  do{prev=s;s=s.replace(/^(large|medium|small|ripe|fresh|ground|extra|lactose-free|skinless)\s+/,"")}while(s!==prev);
  return s.replace(/s$/,"");
}

const LS_DATA="mealPlanner_data_v1", LS_SYNC="mealPlanner_sync_v1";
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function normalizeData(d){
  d=d||{};
  d.settings={...clone(DEFAULT_SETTINGS),...(d.settings||{})};
  d.settings.people={...DEFAULT_SETTINGS.people,...(d.settings.people||{})};
  d.recipes=d.recipes||{}; d.plans=d.plans||{}; d.updatedAt=d.updatedAt||0;
  return d;
}
function loadData(){let d=null;try{d=JSON.parse(safeGet(LS_DATA)||"null")}catch(e){}return normalizeData(d||clone(SEED))}
let D=loadData();
function getSync(){try{return {url:"",token:"",lastSynced:0,...(JSON.parse(safeGet(LS_SYNC)||"null")||{})}}catch(e){return {url:"",token:"",lastSynced:0}}}
function setSync(s){safeSet(LS_SYNC,JSON.stringify(s))}
let syncState=getSync().url?"pending":"off", syncMsg="", syncTimer=null, syncing=false;

function save(){
  D.updatedAt=Date.now();
  const cutoff=addDays(keyOf(mondayOf(new Date())),-84);
  for(const k of Object.keys(D.plans)) if(k<cutoff) delete D.plans[k];
  safeSet(LS_DATA,JSON.stringify(D));
  if(getSync().url){syncState="pending";clearTimeout(syncTimer);syncTimer=setTimeout(syncUp,1500)}
  paintSync();
}
async function syncUp(){
  const s=getSync();
  if(!s.url){syncState="off";paintSync();return}
  if(!navigator.onLine){syncState="pending";syncMsg="Offline";paintSync();return}
  if(syncing){clearTimeout(syncTimer);syncTimer=setTimeout(syncUp,1500);return}
  syncing=true;const stamp=D.updatedAt;
  try{
    const res=await fetch(s.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:s.token,data:D})});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||j.message||"Sync failed");
    const s2=getSync();s2.lastSynced=stamp;setSync(s2);
    syncState=D.updatedAt>stamp?"pending":"ok";syncMsg="";
  }catch(e){syncState="error";syncMsg=e.message||"Couldn't reach Drive"}
  finally{syncing=false;paintSync()}
}
async function syncDown(){
  const s=getSync();
  if(!s.url){syncState="off";paintSync();return}
  if(!navigator.onLine){paintSync();return}
  try{
    const res=await fetch(s.url+(s.url.includes("?")?"&":"?")+"token="+encodeURIComponent(s.token));
    const j=await res.json();
    if(!j.ok) throw new Error(j.message||j.error||"Not connected");
    const remote=j.data&&j.data.updatedAt?j.data:null;
    if(remote&&remote.updatedAt>D.updatedAt){
      D=normalizeData(remote);safeSet(LS_DATA,JSON.stringify(D));
      const s2=getSync();s2.lastSynced=D.updatedAt;setSync(s2);
      UI.suggestion=null;syncState="ok";syncMsg="";render();
    }else if(!remote||D.updatedAt>remote.updatedAt){await syncUp()}
    else{syncState="ok";syncMsg=""}
  }catch(e){syncState="error";syncMsg=e.message||"Couldn't reach Drive"}
  paintSync();
}
function syncText(){
  return {ok:"Saved to your Drive",pending:"Saving to Drive…",error:"Couldn't reach Drive"+(syncMsg?": "+syncMsg:"")+". Your changes are safe on this phone and will be sent later.",off:"Saved on this phone only. Tap to connect Google Drive."}[syncState];
}
function paintSync(){
  const b=document.getElementById("syncbtn");
  if(b){b.className="tbtn sync-"+syncState;b.setAttribute("aria-label",syncText());b.title=syncText()}
}

/* ============ Planning ============ */
const emptyDays=()=>DAYS.map(()=>({breakfast:null,lunch:null,dinner:null}));
function generatePlan(keepExtras){
  const st=D.settings,all=allRecipes();
  const r=rng(hashStr(UI.weekKey+":"+UI.shuffleN));
  const rot=(st.rotation||[]).filter(id=>all[id]&&!avoidHits(all[id]).length);
  const days=emptyDays();
  const b=all[st.breakfastBatch]?st.breakfastBatch:rot.find(id=>fits(all[id],"breakfast"))||null;
  days.forEach(d=>d.breakfast=b);
  let pool=rot.filter(id=>fits(all[id],"lunch")&&!["Bread","Snack","Breakfast"].includes(all[id].category));
  const last=new Set(), lp=D.plans[addDays(UI.weekKey,-7)];
  if(lp&&lp.days) lp.days.forEach(d=>d&&d.lunch&&last.add(d.lunch));
  const maxRep=Math.max(1,st.maxRepeat||2);
  const n=Math.max(1,Math.min(Math.ceil(7/maxRep),pool.length));
  const fresh=pool.filter(id=>!last.has(id)); if(fresh.length>=n) pool=fresh;
  const frz=id=>(all[id].tags||[]).includes("freezer-friendly");
  const picks=shuffle(pool.filter(frz),r).concat(shuffle(pool.filter(id=>!frz(id)),r)).slice(0,n);
  if(picks.length) days.forEach((d,i)=>d.lunch=picks[i%picks.length]);
  if(st.fillDinners){
    const dp=shuffle(rot.filter(id=>fits(all[id],"dinner")&&!picks.includes(id)),r);
    if(dp.length) days.forEach((d,i)=>d.dinner=dp[i%dp.length]);
  }
  return {days,batchAdjust:{},checked:{},extras:keepExtras||[]};
}
function normalizePlan(p){
  const days=emptyDays();
  (p.days||[]).slice(0,7).forEach((d,i)=>SLOTS.forEach(s=>days[i][s]=d&&typeof d[s]==="string"?d[s]:null));
  return {days,batchAdjust:p.batchAdjust||{},checked:p.checked||{},extras:Array.isArray(p.extras)?p.extras:[]};
}
function planSaved(){return !!D.plans[UI.weekKey]}
function plan(){
  if(D.plans[UI.weekKey]) return D.plans[UI.weekKey]=normalizePlan(D.plans[UI.weekKey]);
  if(!UI.suggestion) UI.suggestion=generatePlan();
  return UI.suggestion;
}
function commit(p){D.plans[UI.weekKey]=p||plan();UI.suggestion=null;save()}
function cookList(){
  const all=allRecipes(),P=plan(),order=[],portions={};
  P.days.forEach(d=>SLOTS.forEach(s=>{
    const id=d[s];if(!id||!all[id]) return;
    if(!(id in portions)){portions[id]=0;order.push(id)}
    portions[id]+=(D.settings.people[s]||0)*(all[id].perMeal||1);
  }));
  return order.map(id=>{
    const r=all[id],need=portions[id],auto=need>0?Math.ceil(need/r.servings):0;
    return {id,r,need,auto,batches:Math.max(0,auto+(P.batchAdjust[id]||0))};
  });
}
function dayNutrition(d){
  const all=allRecipes(),t=[0,0,0,0,0];let any=false;
  SLOTS.forEach(s=>{const r=all[d[s]];if(!r||!r.n) return;any=true;r.n.forEach((v,i)=>t[i]+=(+v||0)*(r.perMeal||1))});
  return any?t:null;
}
function shoppingList(){
  const groups={};
  for(const c of cookList()){
    if(!c.batches) continue;
    for(const [a,u,item] of c.r.ing){
      const aisle=aisleOf(item,u);if(!aisle) continue;
      const key=normKey(item);
      groups[aisle]=groups[aisle]||{};
      const g=groups[aisle][key]=groups[aisle][key]||{key,name:item.split(",")[0].trim(),amounts:{}};
      g.amounts[u]=(g.amounts[u]||0)+(+a||0)*c.batches;
    }
  }

}

    const made=c.batches*c.r.servings, spare=made-c.need;
    h+=`<div class="cook"><div class="t"><button data-act="open" data-id="${esc(c.id)}">${esc(c.r.title)}</button><span class="small muted num">${c.batches?`${c.batches} × batch = ${made} portions · ${c.need} needed${spare>0?` · ${spare} spare${(c.r.tags||[]).includes("freezer-friendly")?" to freeze":""}`:""}`:`Already made · ${c.need} portion${c.need>1?"s":""} planned`}</span></div>
    <div class="stepper" role="group" aria-label="Batches of ${esc(c.r.title)}"><button data-act="batch" data-id="${esc(c.id)}" data-n="-1" aria-label="One batch fewer">−</button><span class="num">${c.batches}</span><button data-act="batch" data-id="${esc(c.id)}" data-n="1" aria-label="One batch more">+</button></div></div>`;
  }
  h+=`</section>`;
  // week at a glance
  h+=`<section class="card"><div class="sectionhead"><h2>Lunches this week</h2>${planSaved()?`<button class="btn ghost" data-act="shuffle" style="min-height:34px;padding:4px 12px">Re-plan</button>`:""}</div><div class="glance">`;
  P.days.forEach((x,i)=>{const r=all[x.lunch];h+=`<span class="gd ${i===ti?"today":""}">${DAYS[i]}</span><button data-act="day" data-d="${i}">${r?esc(r.title):'<span class="muted">Nothing yet</span>'}</button>`});
  h+=`</div></section>`;
  const dt=P.days.map(dayNutrition).filter(Boolean);
  if(dt.length){const avg=dt.reduce((a,t)=>a.map((v,i)=>v+t[i]),[0,0,0,0,0]).map(v=>v/dt.length);h+=`<section class="card"><div class="sectionhead"><h2>Daily average</h2><span class="muted small">planned meals, per person</span></div>${tiles(avg)}</section>`}
  h+=`<p class="muted small">Nutrition is an estimate per serving from standard ingredient values; brands vary.</p></div></main>`;
  return h;
}
function tiles(n){
  const L=[["kcal",""],["protein","g"],["carbs","g"],["fat","g"],["fibre","g"]];
  return `<div class="tiles">${L.map(([l,u],i)=>`<div class="tile"><b class="num">${i===0?nk(n[i]):Math.round(n[i]*10)/10}${u}</b><span>${l}</span></div>`).join("")}</div>`;
}
function filterRecipes(){
  const q=UI.q.trim().toLowerCase(),f=UI.filter,st=D.settings;
  return recipeList().filter(r=>{
    if(f==="Favourites"&&!st.favourites.includes(r.id)) return false;
    if(f==="In rotation"&&!st.rotation.includes(r.id)) return false;
    if(CATEGORIES.includes(f)&&r.category!==f) return false;
    if(f==="Batch"&&!(r.tags||[]).includes("batch")) return false;
    if(f==="Freezer"&&!(r.tags||[]).includes("freezer-friendly")) return false;
    if(f==="Quick"&&((r.time.prep||0)+(r.time.cook||0))>25) return false;
    if(q&&!(r.title+" "+(r.tags||[]).join(" ")+" "+(r.ing||[]).map(i=>i[2]).join(" ")).toLowerCase().includes(q)) return false;
    return true;
  });
}
function recipeCards(list){

}

function readForm(){

  return {
    title:v("f-title").trim()||"Untitled recipe",category:v("f-cat"),
    meals:["breakfast","lunch","dinner","snack"].filter(m=>$("#f-m-"+m).checked),
    servings:Math.max(1,Math.round(num("f-serv",4))),perMeal:Math.max(1,Math.round(num("f-per",1))),
    yield:v("f-yield").trim(),time:{prep:num("f-prep",0),rest:num("f-rest",0),cook:num("f-cook",0)},
    ing:v("f-ing").split("\n").map(parseLine).filter(Boolean),

    storage:v("f-store").trim(),tips:v("f-tips").trim(),

  };

/* ============ Actions ============ */
let toastT;
function toast(m){$("#toast").innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$("#toast").innerHTML="",3200)}
function go(v,id){
  if(v==="recipe"){UI.view="recipe";UI.recipeId=id;history.pushState(null,"","#r-"+id)}
  else{UI.view=v;history.pushState(null,"","#"+v)}
  UI.sheet=null;render();window.scrollTo(0,0);
}
function fromHash(){
  const h=location.hash.slice(1);
  if(h.startsWith("r-")){UI.view="recipe";UI.recipeId=h.slice(2)}
  else UI.view=["week","recipes","shop"].includes(h)?h:"week";
}
window.addEventListener("popstate",()=>{fromHash();UI.sheet=null;render()});
const toggleIn=(arr,id)=>{const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id)};
function shopText(){
  const P=plan(),groups=shoppingList(),lines=["Shopping "+weekLabel()];
  for(const a of AISLES){const g=groups[a];if(!g) continue;const items=Object.values(g).filter(it=>!(P.checked||{})["k:"+a+":"+it.key]);if(!items.length) continue;lines.push("",a.toUpperCase());items.sort((x,y)=>x.name.localeCompare(y.name)).forEach(it=>lines.push("• "+(amountText(it.amounts)?amountText(it.amounts)+" ":"")+it.name))}
  const ex=(P.extras||[]).filter(x=>!x.done);if(ex.length){lines.push("","EXTRAS");ex.forEach(x=>lines.push("• "+x.text))}
  return lines.join("\n");
}
function readSyncForm(){return {url:($("#surl")||{}).value.trim(),token:($("#stok")||{}).value.trim()}}

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el) return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="scrim"){if(e.target===el) closeSheet();return}
  switch(a){
    case "go": go(el.dataset.v);break;
    case "back": history.length>1?history.back():go("recipes");break;
    case "open": go("recipe",id);break;
    case "close": closeSheet();break;
    case "day": UI.day=+el.dataset.d;render();window.scrollTo({top:0,behavior:"smooth"});break;
    case "week": UI.weekKey=addDays(UI.weekKey,7*+el.dataset.n);UI.suggestion=null;UI.shuffleN=0;UI.day=Math.max(0,todayIndex());render();break;
    case "settings": openSheet({type:"settings"});break;
    case "keep": commit();render();toast("Week saved");break;
    case "shuffle": {UI.shuffleN++;const ex=plan().extras;const p=generatePlan(ex);if(planSaved()) commit(p);else UI.suggestion=p;render();break}
    case "batch": {const c=cookList().find(x=>x.id===id);if(!c) break;const P=plan();P.batchAdjust[id]=Math.max(0,c.batches+ +el.dataset.n)-c.auto;commit(P);render();break}
    case "slot": openSheet({type:"picker",d:+el.dataset.d,slot:el.dataset.s,q:"",all:false});break;
    case "pickall": UI.sheet.all=!UI.sheet.all;renderSheet();break;
    case "pick": {const P=plan();P.days[UI.sheet.d][UI.sheet.slot]=id||null;closeSheet();commit(P);render();break}
    case "pickrest": {const s=UI.sheet,P=plan(),cur=P.days[s.d][s.slot];if(!cur){toast("Choose a recipe for this day first.");break}for(let i=s.slot==="breakfast"?0:s.d;i<7;i++) P.days[i][s.slot]=cur;closeSheet();commit(P);render();break}
    case "filter": UI.filter=el.dataset.f;render();break;
    case "fav": toggleIn(D.settings.favourites,id);save();render();break;
    case "rot": toggleIn(D.settings.rotation,id);save();render();toast(D.settings.rotation.includes(id)?"Added to rotation":"Removed from rotation");break;
    case "scale": {const r=R(UI.recipeId);UI.scale[r.id]=Math.max(1,(UI.scale[r.id]||r.servings)+ +el.dataset.n);render();break}
    case "step": {const m=UI.doneSteps[UI.recipeId]=UI.doneSteps[UI.recipeId]||{};m[el.dataset.i]=!m[el.dataset.i];render();break}
    case "addweek": openSheet({type:"addweek",id});break;
    case "awslot": UI.sheet.slot=el.dataset.s;renderSheet();break;
    case "awday": toggleIn(UI.sheet.days,+el.dataset.d);renderSheet();break;
    case "awsave": {const s=UI.sheet,P=plan();s.days.forEach(d=>P.days[d][s.slot]=s.id);closeSheet();commit(P);toast("Added to your week");render();break}
    case "new": openSheet({type:"edit",isNew:true,r:{title:"",category:"Lunch",meals:["lunch"],servings:4,perMeal:1,time:{prep:0,rest:0,cook:0},ing:[],steps:[],tags:["batch"],variations:[]}});break;
    case "edit": openSheet({type:"edit",isNew:false,id,r:clone(R(id))});break;
    case "reset": delete D.recipes[id];save();render();toast("Original recipe restored");break;
    case "askdelete": openSheet({type:"confirm",title:BUILTIN[id]?"Remove from library?":"Delete this recipe?",text:BUILTIN[id]?"It will disappear from your recipes and rotation.":"This can't be undone.",ok:BUILTIN[id]?"Remove":"Delete",act:"dodelete",id});break;
    case "dodelete": {
      if(BUILTIN[id]) D.recipes[id]={hidden:true}; else delete D.recipes[id];
      const ri=D.settings.rotation.indexOf(id);if(ri>=0) D.settings.rotation.splice(ri,1);
      save();closeSheet();go("recipes");toast("Recipe removed");break}
    case "setp": {
      const k=el.dataset.k,n=+el.dataset.n,st=D.settings;
      if(k==="maxRepeat") st.maxRepeat=Math.min(7,Math.max(1,(st.maxRepeat||2)+n));
      else{const s=k.split(".")[1];st.people[s]=Math.min(8,Math.max(0,st.people[s]+n))}
      save();UI.suggestion=null;render();break}
    case "showrot": UI.filter="In rotation";go("recipes");break;
    case "savesync": {const f=readSyncForm(),s=getSync();setSync({...s,...f});if(!f.url){syncState="off";renderSheet();break}syncState="pending";$("#syncmsg").textContent="Connecting…";await syncDown();renderSheet();toast(syncState==="ok"?"Connected to Google Drive":"Couldn't connect yet");break}
    case "testsync": {const f=readSyncForm(),m=$("#syncmsg");if(!f.url){m.textContent="Add the web app link first.";break}m.textContent="Testing…";
      try{const res=await fetch(f.url+(f.url.includes("?")?"&":"?")+"token="+encodeURIComponent(f.token));const j=await res.json();m.textContent=j.ok?"✓ "+(j.message||"Connected"):"✕ "+(j.message||"Not connected")}
      catch(err){m.textContent="✕ Couldn't reach the script. Check the link, and that it's deployed with access for \"Anyone\"."}break}
    case "syncnow": await syncDown();renderSheet();break;
    case "share": {const txt=shopText();
      if(navigator.share){try{await navigator.share({title:"Shopping list",text:txt})}catch(err){}break}
      try{await navigator.clipboard.writeText(txt);toast("List copied")}catch(err){openSheet({type:"copy",text:txt})}break}
    case "untick": {const P=plan();P.checked={};(P.extras||[]).forEach(x=>x.done=false);commit(P);render();break}
    case "rmextra": {const P=plan();P.extras.splice(+el.dataset.i,1);commit(P);render();break}
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){UI.q=e.target.value;$("#rlist").innerHTML=recipeCards(filterRecipes())}
  if(e.target.id==="pq"&&UI.sheet){UI.sheet.q=e.target.value;$("#plist").innerHTML=pickerItems(UI.sheet)}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.chk){const P=plan();P.checked=P.checked||{};if(t.checked) P.checked[t.dataset.chk]=true;else delete P.checked[t.dataset.chk];commit(P);render();return}
  if(t.dataset.extra){const P=plan(),x=P.extras[+t.dataset.extra];if(x){x.done=t.checked;commit(P);render()}return}
  if(t.dataset.set){D.settings[t.dataset.set]=t.type==="checkbox"?t.checked:t.dataset.set==="avoid"?t.value.split(",").map(x=>x.trim()).filter(Boolean):t.value;save();UI.suggestion=null;render();return}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="extraform"){const v=$("#extra").value.trim();if(!v) return;const P=plan();P.extras=P.extras||[];P.extras.push({text:v,done:false});commit(P);render();const ni=$("#extra");if(ni) ni.focus();return}
  if(e.target.id==="editform"){
    const s=UI.sheet,data=readForm();
    if(!data.ing.length&&s.isNew){toast("Add at least one ingredient.");return}
    if(!data.steps.length) data.steps=["Your own recipe: tap Edit to add the ingredients and method."];
    const id=s.isNew?"c"+Date.now().toString(36):s.id;
    data.src=s.isNew?"mine":(R(id)||{}).src||"mine";
    D.recipes[id]={recipe:data};
    if(s.isNew&&!D.settings.rotation.includes(id)) D.settings.rotation.push(id);
    save();closeSheet();
    if(s.isNew) go("recipe",id);else render();
    toast(s.isNew?"Recipe added to your library and rotation":"Recipe saved");
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&UI.sheet) closeSheet()});
window.addEventListener("online",syncDown);
document.addEventListener("visibilitychange",()=>{if(!document.hidden) syncDown()});

fromHash();render();syncDown();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
